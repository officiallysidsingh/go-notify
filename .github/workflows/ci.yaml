name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  setup:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      go-version: ${{ steps.go.outputs.go-version }}
    steps:
      - uses: actions/checkout@v4.2.2
      - id: go
        uses: actions/setup-go@v5.2.0
        with:
          go-version-file: go.mod
          cache: true

  lint:
    needs: setup
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-go@v5.2.0
        with:
          go-version-file: go.mod
          cache: true
      - run: gofmt -l . | grep . && exit 1 || true
      - run: go vet ./...
      - uses: golangci/golangci-lint-action@v6.1.1
        with:
          version: v1.60.3

  generate:
    needs: setup
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-go@v5.2.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: arduino/setup-protoc@v3.0.0
        with:
          version: "27.3"
      - run: go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.1
      - run: go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.5.1
      - run: make proto
      - run: go mod tidy
      - run: git diff --exit-code go.mod go.sum api/generated

  unit:
    needs: setup
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-go@v5.2.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: arduino/setup-protoc@v3.0.0
        with:
          version: "27.3"
      - run: go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.1
      - run: go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.5.1
      - run: make proto
      - run: make test

  integration:
    needs: setup
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-go@v5.2.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: arduino/setup-protoc@v3.0.0
        with:
          version: "27.3"
      - run: go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.1
      - run: go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.5.1
      - run: make proto
      - run: make test-integration

  coverage:
    needs: [unit, integration]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-go@v5.2.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: arduino/setup-protoc@v3.0.0
        with:
          version: "27.3"
      - run: go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.1
      - run: go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.5.1
      - run: make proto
      - run: make coverage
      - uses: actions/upload-artifact@v4.4.3
        with:
          name: coverage.out
          path: coverage.out

  security:
    needs: setup
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-go@v5.2.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: arduino/setup-protoc@v3.0.0
        with:
          version: "27.3"
      - run: go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.1
      - run: go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.5.1
      - run: make proto
      - run: go install golang.org/x/vuln/cmd/govulncheck@v1.1.3
      - run: govulncheck ./...

  images:
    needs: [lint, generate, unit, integration, coverage, security]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: docker/setup-buildx-action@v3.6.1
      - name: Build server image
        run: docker buildx build -f deployments/docker/Dockerfile.grpc --platform linux/amd64 --tag go-notify-server:ci .
      - name: Build worker image
        run: docker buildx build -f deployments/docker/Dockerfile.worker --platform linux/amd64 --tag go-notify-worker:ci .
      - name: Login to Docker Hub
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3.3.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Push images
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          SHA: ${{ github.sha }}
        run: |
          docker tag go-notify-server:ci "$DOCKER_USERNAME/go-notify-server:$SHA"
          docker tag go-notify-server:ci "$DOCKER_USERNAME/go-notify-server:latest"
          docker tag go-notify-worker:ci "$DOCKER_USERNAME/go-notify-worker:$SHA"
          docker tag go-notify-worker:ci "$DOCKER_USERNAME/go-notify-worker:latest"
          docker push "$DOCKER_USERNAME/go-notify-server:$SHA"
          docker push "$DOCKER_USERNAME/go-notify-server:latest"
          docker push "$DOCKER_USERNAME/go-notify-worker:$SHA"
          docker push "$DOCKER_USERNAME/go-notify-worker:latest"
