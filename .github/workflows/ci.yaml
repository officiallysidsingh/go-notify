name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-go@v5.2.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: arduino/setup-protoc@v3.0.0
        with:
          version: "27.3"
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Install Go protoc plugins
        run: |
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.1
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.5.1
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - run: make proto
      - run: gofmt -l . | grep . && exit 1 || true
      - run: go vet ./...
      - uses: golangci/golangci-lint-action@v7.0.0
        with:
          version: v2.15.0

  # Verifies `make proto` and `go mod tidy` both succeed on a clean checkout
  # and that go.mod/go.sum are tidy. api/generated is gitignored, so it is not diffed.
  generate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-go@v5.2.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: arduino/setup-protoc@v3.0.0
        with:
          version: "27.3"
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Install Go protoc plugins
        run: |
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.1
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.5.1
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - run: make proto
      - run: go mod tidy
      - run: git diff --exit-code go.mod go.sum

  unit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-go@v5.2.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: arduino/setup-protoc@v3.0.0
        with:
          version: "27.3"
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Install Go protoc plugins
        run: |
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.1
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.5.1
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - run: make proto
      - run: make test

  integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-go@v5.2.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: arduino/setup-protoc@v3.0.0
        with:
          version: "27.3"
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Install Go protoc plugins
        run: |
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.1
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.5.1
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - run: make proto
      - run: make test-integration

  coverage:
    needs: [unit, integration]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-go@v5.2.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: arduino/setup-protoc@v3.0.0
        with:
          version: "27.3"
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Install Go protoc plugins
        run: |
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.1
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.5.1
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - run: make proto
      - run: make coverage
      - uses: actions/upload-artifact@v4.4.3
        with:
          name: coverage.out
          path: coverage.out

  security:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-go@v5.2.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: arduino/setup-protoc@v3.0.0
        with:
          version: "27.3"
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Install Go protoc plugins
        run: |
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.1
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.5.1
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - run: make proto
      - run: go install golang.org/x/vuln/cmd/govulncheck@v1.10.0
      - run: govulncheck ./...

  images:
    needs: [lint, generate, unit, integration, coverage, security]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-go@v5.2.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: arduino/setup-protoc@v3.0.0
        with:
          version: "27.3"
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Install Go protoc plugins
        run: |
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.1
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.5.1
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - run: make proto
      - uses: docker/setup-buildx-action@v3.6.1
      - name: Build server image
        run: |
          for attempt in 1 2 3; do
            if docker buildx build -f deployments/docker/Dockerfile.grpc --platform linux/amd64 --tag go-notify-server:ci .; then
              exit 0
            fi
            echo "server build attempt $attempt failed; retrying in 15s" >&2
            sleep 15
          done
          exit 1
      - name: Build worker image
        run: |
          for attempt in 1 2 3; do
            if docker buildx build -f deployments/docker/Dockerfile.worker --platform linux/amd64 --tag go-notify-worker:ci .; then
              exit 0
            fi
            echo "worker build attempt $attempt failed; retrying in 15s" >&2
            sleep 15
          done
          exit 1
      - name: Login to Docker Hub
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3.3.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Push images
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          SHA: ${{ github.sha }}
        run: |
          docker tag go-notify-server:ci "$DOCKER_USERNAME/go-notify-server:$SHA"
          docker tag go-notify-server:ci "$DOCKER_USERNAME/go-notify-server:latest"
          docker tag go-notify-worker:ci "$DOCKER_USERNAME/go-notify-worker:$SHA"
          docker tag go-notify-worker:ci "$DOCKER_USERNAME/go-notify-worker:latest"
          docker push "$DOCKER_USERNAME/go-notify-server:$SHA"
          docker push "$DOCKER_USERNAME/go-notify-server:latest"
          docker push "$DOCKER_USERNAME/go-notify-worker:$SHA"
          docker push "$DOCKER_USERNAME/go-notify-worker:latest"
